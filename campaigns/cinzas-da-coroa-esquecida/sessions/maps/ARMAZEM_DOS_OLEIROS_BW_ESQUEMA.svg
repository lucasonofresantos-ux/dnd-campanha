<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Mapa tático esquemático do segundo andar do Armazém dos Oleiros mostrando Eron e Varen no depósito escuro e quatro pessoas na sala iluminada. Sem escala real.">
<defs><linearGradient id="warm" x2="0" y2="1"><stop stop-color="#715234"/><stop offset="1" stop-color="#35271d"/></linearGradient><linearGradient id="cold" x2="0" y2="1"><stop stop-color="#22343b"/><stop offset="1" stop-color="#101c24"/></linearGradient><radialGradient id="light"><stop stop-color="#f8b955" stop-opacity=".4"/><stop offset="1" stop-color="#f8b955" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="760" fill="#0e1316"/><text x="45" y="56" font-size="34" font-family="Georgia,serif" fill="#e5c99a">ARMAZÉM DOS OLEIROS · SEGUNDO ANDAR</text><text x="45" y="88" font-size="17" fill="#b3ada5" font-family="sans-serif">Planta ilustrativa | Posições relativas, sem escala nem distâncias canônicas</text>
<rect x="42" y="120" width="400" height="510" rx="8" fill="url(#cold)" stroke="#8b98a5" stroke-width="6"/><rect x="472" y="120" width="680" height="510" rx="8" fill="url(#warm)" stroke="#ae8a66" stroke-width="6"/>
