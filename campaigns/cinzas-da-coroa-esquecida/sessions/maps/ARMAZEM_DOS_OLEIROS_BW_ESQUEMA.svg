<rect x="480" y="160" width="590" height="420" fill="url(#light)"/>
<g fill="#4d4032" stroke="#968161" stroke-width="3"><rect x="75" y="170" width="120" height="100"/><rect x="222" y="183" width="135" height="95"/><rect x="82" y="468" width="135" height="112"/><rect x="245" y="500" width="110" height="81"/></g><g fill="#c2af8f" font-size="16" font-family="sans-serif"><text x="78" y="228">Caixotes</text><text x="233" y="241">Sacos</text><text x="100" y="532">Caixotes</text></g>
<rect x="659" y="288" width="230" height="160" rx="12" fill="#4a2b18" stroke="#cd9250" stroke-width="5"/><text x="717" y="320" font-size="19" font-family="Georgia,serif" fill="#fce4b9">MESA</text><g fill="#e9b86e" font-size="16" font-family="sans-serif"><text x="690" y="364">Réplica</text><text x="788" y="364">Livro</text><text x="730" y="411">Folha</text></g>
<path d="M1150 430h35" stroke="#e8cc92" stroke-width="8"/><polygon points="1192,430 1173,418 1173,442" fill="#e8cc92"/><text x="982" y="401" fill="#f8ddab" font-size="17">Corredor lateral</text>
<g font-family="Georgia,serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central"><g><circle cx="409" cy="434" r="26" fill="#174769" stroke="#bed7eb" stroke-width="4"/><text x="409" y="434" fill="#fff">E</text></g><g><circle cx="226" cy="345" r="26" fill="#174769" stroke="#bed7eb" stroke-width="4"/><text x="226" y="345" fill="#fff">V</text></g><g><circle cx="807" cy="246" r="26" fill="#7b2726" stroke="#fad4bd" stroke-width="4"/><text x="807" y="246" fill="#fff">M</text></g><g><circle cx="1058" cy="458" r="26" fill="#7b2726" stroke="#fad4bd" stroke-width="4"/><text x="1058" y="458" fill="#fff">L</text></g><g><circle cx="635" cy="452" r="26" fill="#7b2726" stroke="#fad4bd" stroke-width="4"/><text x="635" y="452" fill="#fff" font-size="17">F1</text></g><g><circle cx="943" cy="534" r="26" fill="#7b2726" stroke="#fad4bd" stroke-width="4"/><text x="943" y="534" fill="#fff" font-size="17">F2</text></g></g>
<text x="130" y="150" font-family="Georgia,serif" font-size="25" fill="#e7d3ba">DEPÓSITO · ESCURO</text><text x="642" y="151" font-family="Georgia,serif" font-size="25" fill="#f8dbaf">SALA ILUMINADA</text>
<rect x="45" y="653" width="1110" height="85" rx="7" fill="#202326" stroke="#6b675f"/><text x="67" y="682" font-family="sans-serif" font-size="20" fill="#e9d2a9">E = Eron  ·  V = Varen  ·  M = Mulher  ·  L = Enluvado  ·  F1/F2 = Funcionários</text><text x="67" y="714" font-family="sans-serif" font-size="17" fill="#bfc8ca">Posições aproximadas; geometria e distâncias não medidas. Nenhuma arma visivelmente confirmada.</text>
