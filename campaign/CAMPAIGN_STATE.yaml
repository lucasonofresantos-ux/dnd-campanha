  immediate_visible_situation: "Eron informou dados físicos naturais Lidar com Animais [19]+3=22 e Medicina [20]+3=23. Loba tolerou que Eron tocasse e sustentasse a pata, tensa mas sem morder; exame revelou fragmento pequeno de arame superficial junto a escoriação de constrição. Eron removeu cuidadosamente o fragmento com ferramenta fina, lavou com água do cantil e improvisou faixa com pequena tira de suas roupas de viajante; loba ganiou no momento doloroso, permitiu completar, depois farejou faixa e lambeu a mão de Eron. Ferida permanece inchada e exige cicatrização/monitoramento, sem cura instantânea ou garantia contra infecção. Correção auditável de saque anterior: pele crua parcialmente danificada e duas orelhas de coelho também foram trazidas, pois 'saquear animal' significa buscar todos os componentes úteis; não há couro curtido ou venda; falha Sobrevivência 6 ainda causou perda de carne e flecha. Desafio de assistência difícil e real foi resolvido +25 XP discricionários, sem resolver a ameaça ao rebanho (prêmio12PO não recebido). ~16h20, 12/12PV, CA16, 19flechas utilizáveis."
