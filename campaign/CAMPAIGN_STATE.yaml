  status: "awaiting_player_action_at_wolf_den_day5"
  current_npcs_present: ["Loba aparentemente recuperada", "Dois filhotes"]
  immediate_visible_situation: "Dia4 ~18h45–Dia5 ~06h00: Eron despediu-se de Mara, subiu ao quarto 3, tomou banho e dormiu desde ~19h15. Descanso longo concluído sem incidentes; PV12/12, dado de vida 1d8, Inspiração Heroica já disponível, nenhuma condição. Dia5 ~07h20 Percepção 1d20+7 [16]+7=23: no local do terceiro laço desarmado entre raízes, arame anterior desapareceu e marcas recentes de botas na terra; nenhum novo laço nesse trecho, autoria não identificada. ~07h45 primeira caça Sobrevivência 1d20+5 [19]+5=24, Percepção 1d20+7 [3]+7=10, falha de observação e corço escapou antes de disparo. Furtividade 1d20+9 [6]+9=15 rolada antecipadamente e não aplicada. Segunda tentativa Sobrevivência 1d20+5 [8]+5=13, Percepção 1d20+7 [7]+7=14, Furtividade 1d20+9 [4]+9=13. Corça adulta: ataque arco curto vantagem 2d20kh1+7 [14,16] mantido 16+7=23, acerto; dano com furtivo 2d6+5 [6,1]+5=12, abate; saque Sobrevivência/Coureiro vantagem 2d20kh1+5 [11,17] mantendo 17+5=22. ~09h05 obteve 9kg carne, pele crua boa, 2 orelhas, 2 ossos longos, feixe de tendões, coração e fígado. Flecha consumida, 19 na aljava +1 reserva, 20 totais; 8 perdidas acumuladas. ~09h45 chegou à toca; loba sem claudicação visível ao caminhar, crias presentes, restos de pequena ave junto à entrada, origem não confirmada. Carne ainda não entregue; sem novo exame. Rolagens efetivamente executadas via container com script cujo git hash-object conferiu d35af70119bf684ea055619bb10678a1c4b03bbb. Nenhum XP novo por caça rotineira ou simples observação de pista ainda não resolvida; XP125/300, saldo41PO9PP7PC, 3 rações, sal200g, projeto de 12 flechas pendentes, recompensa de Mara ainda não recebida nem confirmada pelo personagem."
