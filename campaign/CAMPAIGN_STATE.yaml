scene:
  id: OPENING-001
  status: "awaiting_player_after_wolf_forepaw_rebandaged_day2"
  current_npcs_present: []
  immediate_visible_situation: "Jogador informou rolagens físicas naturais: Lidar com Animais d20=19+3=22, Medicina d20=20+3=23, e declarou tratar a pata com pomada e o necessário. Ambos testes bem-sucedidos sem novo lançamento do Mestre. Mãe loba, alimentada há pouco com ~2kg carne de corço, permitiu Eron aproximar, sustentar pata e retirar faixa suja do Dia1. Exame mostrou ferida de arame ainda inchada e quente, começando a fechar nas bordas, SEM pus ou odor ruim ou fragmento metálico visível; infecção não excluída, nenhuma infecção avançada evidente. Eron lavou com água do cantil, passou UMA aplicação de unguento suave de Olma (pote parcialmente cheio) e colocou UMA atadura limpa frouxa (conjunto avulso consumido). Loba contraiu pata brevemente mas não mordeu, depois apoiou por instante e repousou, mantendo-se selvagem e protetora de dois filhotes. O kit de curandeiro permanece 10/10 usos, pois não estabilizou criatura 0PV; nenhum efeito de cura mágica, recuperação completa, imunidade a infecção, dano ou experiência extra. ~10h15 Dia2, 50/300XP, 12/12PV, 31PO1PP, inspiração disponível, 18 flechas, 8kg carne corço, quatro rações intactas, chave quarto3. Nenhuma nova ação de Eron após tratamento."
