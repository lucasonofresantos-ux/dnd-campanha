scene:
  id: OPENING-001
  status: "awaiting_player_after_roe_deer_harvest_and_discovery_of_active_snare"
  current_npcs_present: []
  immediate_visible_situation: "Dia2 ~08h05 Eron oculto atrás de tronco a 20m do corço adulto usou arco curto com vantagem: 2d20kh1+7 → [8,9], maior9+7=16, acertou corço (CA13, PV4, 2024 Deer). Dano 2d6+5 → [2 arco,5 Ataque Furtivo]+5=12 perfurante, corço morto. Uma flecha consumida e sem recuperação reutilizável por regra munição 2024; 18 flechas utilizáveis. Depois Eron examinou marcas perto do riacho: Investigação 1d20+6 → [19]+6=25 e Percepção 1d20+7 → [3]+7=10. Determinou marcas de arame sob tensão em árvore jovem, estaca arrancada, rastros de solas grossas; viu um segundo laço de arame ARMADO entre folhas na trilha, conectado a haste flexível, evitou acioná-lo. Responsável e número de outros laços não determinados, laço AINDA ATIVO. Não percebeu outras pessoas ou movimento com Percepção10. Saque cuidadoso do corço com Ferramentas de Coureiro e Sobrevivência proficiente: 2d20kh1+5 → [1,19], manteve19+5=24; aproveitou aproximadamente 10kg carne fresca, 1 pele crua com pequeno furo da flecha, 2 hastes de galhada curta, 1 feixe de tendões, 2 ossos longos, coração e fígado, todos crus e carregados. Acondicionou em bagagem, necessita conservação, peso estimado ~15kg extra, sem exceder capacidade. ~08h55, nenhuma carne entregue ainda à loba, sem compras ou gastos médicos, sem XP por abate trivial. Eron pode agir em relação ao laço ativo, seguir à toca ou outros planos; 12PV, XP25/300, moedas31PO1PP, Inspiração Heroica, 18flechas, kit10 usos, unguento/ataduras intactos."
