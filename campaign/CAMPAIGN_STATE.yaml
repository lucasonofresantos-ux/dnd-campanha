  immediate_visible_situation: "Dia4 ~06h00–08h00: Eron convidou a loba a caçar e saiu. Rolagens efetivamente executadas em Python via container, usando script com hash Git d35af70119bf684ea055619bb10678a1c4b03bbb. Lidar com Animais 1d20+3 [5]+3=8, falha; loba acompanhou poucos metros e retornou às crias. ~06h50 Percepção 1d20+7 [9]+7=16, identificou terceiro laço distinto entre raízes na Trilha dos Corços; Prestidigitação/Ferramentas de Ladrão 2d20kh1+7 [16,16] mantendo primeiro 16+7=23, desarmou, arame solto junto à árvore. +25 XP por neutralizar novo desafio ambiental, total 125/300. Responsável não identificado. ~07h30 Sobrevivência 1d20+5 [14]+5=19, Percepção 1d20+7 [11]+7=18, Furtividade 1d20+9 [18]+9=27; avistou corço macho adulto ~25m. Ataque arco curto vantagem 2d20kh1+7 [2,14] mantido 14+7=21, acerto; dano furtivo 2d6+5 [5,3]+5=13, abate. ~08h00 saque Sobrevivência/Coureiro vantagem 2d20kh1+5 [3,4] mantido 4+5=9, aproveitamento parcial: 6 kg carne, 1 pele crua danificada, 2 galhadas pequenas, 2 orelhas, 2 ossos longos; miúdos e tendões não aproveitados. Uma flecha consumida, 13 restantes; sal 200g sem uso. Materiais anteriores da lebre permanecem. PV12/12, CA16, dinheiro41PO2PP3PC, Inspiração Heroica disponível; nenhuma recompensa pelo rebanho, XP de caça rotineira zero."
