scene:
  id: OPENING-001
  status: "awaiting_player_action_after_herd_contract_resolution"
  current_npcs_present: ["Mara Telha"]
  immediate_visible_situation: "Dia5 ~10h05–11h55: Eron deixou a toca e retornou ao Pouso das Três Fontes. ~11h40 vendeu materiais restantes da caça do Dia5: Belda comprou pele crua de corça 5PP, feixe de tendões 1PP, dois ossos longos 5PC; Nessa comprou duas orelhas 5PC; Bram comprou coração 1PP, fígado 2PP e 4,5 kg carne fresca 9PP. Total 18PP+10PC=19PP=1PO9PP. Saldo 41PO9PP7PC passou para 43PO8PP7PC. Miúdos rejeitados da lebre antiga não vendidos, permanecem em posse, sem valor alimentar confirmado. Nenhuma rolagem ou XP por comércio. ~11h55 Eron encontrou Mara no curral e perguntou se alguma cabra virou janta. Mara confirmou três noites consecutivas sem perdas (Dia2–3, Dia3–4, Dia4–5), aceitou resolução não letal, pagou 12PO prometidas, encerrou contrato de proteção dos rebanhos e ofereceu ajuda futura não específica. Saldo final 55PO8PP7PC. +50 XP pela resolução substantiva e verificada do problema dos rebanhos, distinta dos primeiros socorros e neutralizações de laços já pontuados, não pela venda/pagamento ou mera repetição de cuidados. Total 175/300, nível1. Reputação com Mara: gratidão e respeito. Investigação opcional de Iria (5PO) permanece aberta, pegadas e arame desaparecido ainda sem autoria identificada. PV12/12 CA16, 20 flechas utilizáveis (19 na aljava e 1 reserva), 3 rações, sal200g, kit9/10, Inspiração Heroica disponível; projeto de 12 flechas pendente, 4h25 de trabalho. Nenhum novo teste."
