  immediate_visible_situation: "Eron falou à loba: 'primeiro vai comer depois vai deixar eu dar um olhada nessa pata', ofereceu cerca de 2kg da carne fresca de corço numa pedra perto da entrada da toca. Loba aproximou-se cautelosamente, comeu e repartiu carne com os dois filhotes, mantendo a atitude vigilante/protetora; filhotes beliscavam os últimos pedaços e não houve ataque. Eron comeu o que restava da única ração diária já quase consumida desde Dia1, encerrando esta porção; ficam 4 rações intactas e nenhuma parcial. Carne de corço em inventário reduzida de ~10kg a ~8kg, demais partes do corço inalteradas. Por volta de 09h55 loba deitou à entrada com a pata dianteira machucada estendida, bandagem ainda suja e pele inchada visível, sem exame aprofundado; ao perceber Eron olhar, ergueu cabeça e observa movimentos sem rosnar. A alimentação foi aceita, mas o exame ainda NÃO foi feito nem a aproximação validada. Mestre pediu teste Sabedoria (Lidar com Animais) +3, AGUARDANDO d20 físico do jogador OU autorização de rolagem; NENHUM teste novo rolado ainda. Kit de curandeiro10 usos, unguento e ataduras ainda intactos. 12/12PV, 50/300XP, 31PO1PP, Inspiração Heroica disponível, 18flechas, chave de quarto3 com Eron; recompensa Mara12PO pendente."
